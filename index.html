<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, shrink-to-fit=no"
    />
    <title>GGastos</title>
    <meta name="theme-color" content="#1F6B57" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="GGastos" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <style>
      html, body, #root { height: 100%; }
      body { margin: 0; background-color: #F7F2EA; }
      #root { display: flex; flex-direction: column; }
      /* Behaves like an app on touch screens: no pinch or double-tap zoom, only panning. */
      html, body { touch-action: pan-x pan-y; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
      /* iOS zooms into any field whose text is smaller than 16px when it gets focus. */
      @media (pointer: coarse) { input, textarea, select { font-size: 16px !important; } }
    </style>
    <script>
      // iOS Safari ignores user-scalable=no, so the pinch gesture is cancelled here.
      ['gesturestart', 'gesturechange', 'gestureend'].forEach(function (name) {
        document.addEventListener(name, function (event) { event.preventDefault(); }, { passive: false });
      });
    </script>
    <script src="/register-sw.js" defer></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
